# =====================================================================================================
# NSSF - Network Slice Selection Function (TS 23.501 §6.2.14)
# Ayuda al AMF a elegir el "slice" (red lógica) para el UE según el S-NSSAI que pide.
# =====================================================================================================
logger:
  level: info

nssf:
  sbi:
    server:
      - address: 10.88.1.17         # IP del NSSF en la red cn
        port: 7777
    client:
      nrf:
        - uri: http://10.88.1.10:7777
      nsi:                          # NSI = Network Slice Instance: para cada slice, qué NRF lo gestiona
        - uri: http://10.88.1.10:7777
          s_nssai:
            sst: 1                  # el único slice del laboratorio: SST 1 (eMBB)
