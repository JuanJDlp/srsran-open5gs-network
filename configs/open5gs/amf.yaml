logger:
  level: info

amf:
  sbi:
    server:
      - address: 10.88.1.2          # cn network
        port: 7777
    client:
      nrf:
        - uri: http://10.88.1.10:7777
  ngap:
    server:
      - address: 10.88.2.2          # ran network (N2)
  metrics:
    server:
      - address: 10.88.1.2
        port: 9090
  guami:
    - plmn_id:
        mcc: 001
        mnc: 01
      amf_id:
        region: 2
        set: 1
  tai:
    - plmn_id:
        mcc: 001
        mnc: 01
      tac: 7
  plmn_support:
    - plmn_id:
        mcc: 001
        mnc: 01
      s_nssai:
        - sst: 1
  security:
    integrity_order: [NIA2, NIA1, NIA0]
    # srsUE 25.10 fails to decipher NEA2 NAS (Registration Accept decodes as garbage);
    # NEA0 first = Open5GS default, the setup used by the srsRAN tutorials. Integrity stays NIA2.
    ciphering_order: [NEA0, NEA1, NEA2]
  network_name:
    full: SISCOM2 5G Lab
    short: SISCOM2
  amf_name: open5gs-amf0
  time:
    t3512:
      value: 540
