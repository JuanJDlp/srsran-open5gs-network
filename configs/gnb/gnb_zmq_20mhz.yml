# srsRAN Project gNB (release_24_10_1) - ZMQ radio, band n3 FDD, 20 MHz, SCS 15 kHz.
# Generated by scripts/gen-radio-configs.sh from the official srsUE tutorial config.
cu_cp:
  amf:
    addr: 10.88.2.2                 # AMF NGAP address (ran network, N2)
    port: 38412
    bind_addr: 10.88.2.20           # gNB address on the ran network
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
  inactivity_timer: 7200

cu_up:
  upf:
    bind_addr: 10.88.2.20           # N3 GTP-U local address

ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://10.88.3.20:2000,rx_port=tcp://10.88.3.21:2001,base_srate=23.04e6
  srate: 23.04
  tx_gain: 75
  rx_gain: 75

cell_cfg:
  dl_arfcn: 368500                  # 1842.5 MHz
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: "00101"
  tac: 7
  pci: 1
  pdcch:
    common:
      ss0_index: 0                  # srsUE capability
      coreset0_index: 12             # srsUE capability
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
  prach:
    prach_config_index: 1
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64

log:
  filename: /logs/gnb.log
  all_level: warning
  hex_max_size: 0

pcap:
  mac_enable: true
  mac_filename: /captures/gnb_mac.pcap
  ngap_enable: true
  ngap_filename: /captures/gnb_ngap.pcap
