# srsUE (srsRAN 4G release_25_10) - 5G SA over ZMQ, band n3, 10 MHz (52 PRB).
# Generated by scripts/gen-radio-configs.sh from the official srsUE tutorial config.
[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 11.52e6
nof_antennas = 1
device_name = zmq
device_args = tx_port=tcp://10.88.3.21:2001,rx_port=tcp://10.88.3.20:2000,base_srate=11.52e6

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1
dl_nr_arfcn = 368500
# must equal the dl_ssb_arfcn printed by the gNB for this bandwidth
ssb_nr_arfcn = 368410
max_nof_prb = 52
nof_prb = 52

[pcap]
enable = mac_nr,nas
mac_nr_filename = /captures/ue_mac_nr.pcap
nas_filename = /captures/ue_nas.pcap

[log]
all_level = warning
phy_lib_level = none
all_hex_limit = 32
filename = /logs/ue.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc  = 63BFA50EE6523365FF14C1F45F88737D
k    = 00112233445566778899aabbccddeeff
imsi = 001010123456780
imei = 353490069873319

[rrc]
release = 15
ue_category = 4

[nas]
apn = internet
apn_protocol = ipv4

[gw]
ip_devname = tun_srsue
ip_netmask = 255.255.0.0

[gui]
enable = false

[channel.dl]
enable = false

[channel.dl.awgn]
enable = false
snr = 30
